name: thesis-gnn
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - ipykernel
  - notebook
  - nbconvert
  - nbstripout
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - networkx
  - tqdm
  - pip
  - py-lief
  - tabulate

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - torch_geometric